# Teaching page cards, grouped by role. Fields: title, meta (instructor/term), description.

- heading: "Instructor - Columbia University"
  courses:
    - title: "Data Analysis for Policy and Decision Making II"
      meta: "Spring 2022"
      description: "This is an intermediate-level course in non-experimental quantitative research methods, especially those related to education policy. The class examines such topics as residual analysis, modeling non-linear relationships and interactions using regression, logistic regression, missing data analyses, multilevel models, and principal components analysis. The course interweaves several concepts: framing research questions; using moderately advanced statistical approaches; learning to manipulate a large-scale longitudinal database; designing empirical tests to examine policy issues with appropriate statistical techniques; and interpreting and conveying research results to diverse audiences."

